id: EP04-scheduled-task
title: Scheduled task created
status: test
tuning: "schtasks /create, Register-ScheduledTask / New-ScheduledTask, or Windows event 4698; admins create tasks
  too, so severity 3 (an incident needs a second rule or tactic); firex-10G: 0"
attack:
  technique: T1053.005
  alt_techniques: [T1053]
  tactic: persistence
severity: 3
confidence: 0.6
kind: match
requires_any: [[command_line], [event_id]]
where: |-
  regexp_matches(command_line, '(?i)(schtasks(\.exe)?["]?\s.*/create|register-scheduledtask|new-scheduledtask)')
  OR event_id = '4698'
group_by: ["coalesce(host, host_ip) AS machine"]
split_gap: 1h
entities: {host: host, user: user, src_ip: "coalesce(src_ip, host_ip)"}
action_text: "a scheduled task was created on {machine} by {user}"
