id: EP03-credential-dumping
title: Credential dumping from LSASS
status: test
tuning: "mimikatz / sekurlsa / lsadump, procdump of lsass, comsvcs.dll MiniDump, an lsass .dmp file; no benign
  process in the synthetic data matches; one hit is enough; firex-10G: 0"
attack:
  technique: T1003.001
  alt_techniques: [T1003]
  tactic: credential-access
severity: 5
confidence: 0.9
promote: true
kind: match
requires_any: [[command_line], [process_name], [file_path]]
where: |-
  regexp_matches(coalesce(command_line, '') || ' ' || coalesce(process_name, '') || ' ' || coalesce(file_path, ''),
    '(?i)(mimikatz|sekurlsa|lsadump::|procdump(64)?(\.exe)?["]?\s.*lsass|comsvcs(\.dll)?["]?,?\s*#?(24|minidump)|lsass[^\\/\s]*\.dmp|out-minidump|nanodump)')
group_by: ["coalesce(host, host_ip) AS machine"]
split_gap: 1h
entities: {host: host, user: user, src_ip: "coalesce(src_ip, host_ip)"}
action_text: "credentials were dumped from LSASS on {machine} as {user}"
