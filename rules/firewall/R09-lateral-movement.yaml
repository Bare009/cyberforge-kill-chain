attack:
  technique: T1021.002
  alt_techniques: [T1021]
  tactic: lateral-movement
  technique_by:
    dst_port: {3389: T1021.001, 22: T1021.004, 5985: T1021.006, 5986: T1021.006}
severity: 4
confidence: 0.85
kind: distinct
