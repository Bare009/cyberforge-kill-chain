status: stable
tuning: "planted 4,000 UDP answers from 4,000 resolvers in 10 min; background: 0 alerts on firex-10G"
attack:
  technique: T1498.002
  alt_techniques: [T1498]
  tactic: impact
severity: 4
confidence: 0.85
kind: distinct
where: "proto = 17 AND src_port = 53 AND NOT src_internal"
