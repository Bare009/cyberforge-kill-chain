id: R19-web-command-injection
title: Command injection against a web server
status: stable
tuning: "planted 55 from one source"
attack:
  technique: T1190
  alt_techniques: ['T1059.004']
  tactic: initial-access
severity: 4
confidence: 0.85
kind: match
where: "log_subtype = 'ips' AND NOT src_internal AND dst_internal AND (attack ILIKE '%command%injection%' OR regexp_matches(lower(url), '(%3b|;|%7c|\\||\\$\\(|%24%28|`)(id|cat|ls|wget|curl|sh|bash|whoami)'))"
group_by: [src_ip, dst_ip]
split_gap: 30m
having: {gte: 20}
entities: {src_ip: src_ip, dst_ip: dst_ip, domain: hostname, url: url}
action_text: "{src_ip} sent {event_count} command injection attempts to {dst_ip} in {minutes} minutes; {passed} were not blocked"
