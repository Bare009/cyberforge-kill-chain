id: R06-slow-credential-stuffing
title: Slow credential stuffing spread across one /24
status: stable
tuning: "planted 90 failures from 79 addresses, 51 users, 1.1 tries per address; steady scanner /24 has 3,384 tries per address"
attack:
  technique: T1110.004
  alt_techniques: [T1110]
  tactic: credential-access
severity: 4
confidence: 0.8
kind: sql
sql: |
  WITH f AS (SELECT * FROM {events} WHERE log_desc = 'Admin login failed' AND NOT src_internal),
  g AS (SELECT src_net24 FROM f GROUP BY src_net24
        HAVING count(DISTINCT src_ip) >= 20 AND count(DISTINCT user) >= 20
           AND count(*) <= 3 * count(DISTINCT src_ip))
  SELECT f.src_net24 AS alert_key, f.source, f.line FROM f JOIN g USING (src_net24)
entities: {src_ip: src_net24, dst_ip: dst_ip, user: user}
action_text: "{src_count} addresses in {src_ip} tried {event_count} admin logins over {hours} hours, about one each, against many user names"
