id: AU02-password-spray
title: Password spray - one source failing logons for many accounts
status: test
tuning: "10 distinct accounts failing from one source in 30 min; a user mistyping fails 1 account, a shared NAT
  address in the synthetic exports at most 3; firex-10G: 0 (no auth records). A firewall's own admin logins
  (log_desc 'Admin login ...', also derived for PAN and ECS exports) are left to R01/R06/R07: on the
  PAN/ECS conversions of firex the internet scanners' admin login noise gave 183 background alerts here"
attack:
  technique: T1110.003
  alt_techniques: [T1110]
  tactic: credential-access
severity: 4
confidence: 0.8
kind: distinct
requires_any: [[event_id, user, src_ip], [category, status, user, src_ip]]
where: |-
  (event_id IN ('4625', '4771') OR (category = 'auth' AND status = 'failed'))
  AND src_ip IS NOT NULL AND user IS NOT NULL AND user NOT LIKE '%$'
  AND coalesce(log_desc, '') NOT LIKE 'Admin login%'
group_by: [src_ip]
field: user
window: 30m
having: {gte: 10}
success: "FALSE"
entities: {src_ip: src_ip, user: user, host: host, dst_ip: "coalesce(dst_ip, host_ip)"}
action_text: "{src_ip} failed logons for {distinct_count} different accounts in {minutes} minutes ({event_count} attempts)"
