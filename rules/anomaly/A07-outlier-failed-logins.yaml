id: A07-outlier-failed-logins
title: Source with far more failed admin logins in an hour than its own normal
status: experimental
layer: anomaly
tuning: "failed admin logins per hour / g(hour) above median + 6 MAD (MAD floor 2), raw >= 50; firex-10G: 0 alerts. The planted burst source has 1 active hour, too few for a baseline (R01 covers it); busiest background hour passing the MAD test has 33 failures"
attack:
  technique: T1110
  alt_techniques: [T1110.001, T1110.003, T1110.004]
  tactic: credential-access
severity: 2
confidence: 0.3
promote: false
kind: sql
sql: |
  WITH ev AS (SELECT source, line, src_ip, ts_utc, date_trunc('hour', ts_utc) AS hr, log_type, log_desc,
                     dst_ip, dst_port, dst_internal, sent_bytes, rcvd_bytes FROM {events} WHERE src_ip IS NOT NULL),
  tot AS (SELECT hr, count(*) FILTER (WHERE log_type = 'traffic') AS s FROM ev GROUP BY hr),
  g AS (SELECT hr, s / nullif((SELECT median(s) FROM tot), 0) AS g FROM tot),
  h AS (SELECT src_ip, hr, count(*) FILTER (WHERE log_desc = 'Admin login failed') AS x FROM ev GROUP BY src_ip, hr),
  n AS (SELECT h.*, h.x / nullif(g.g, 0) AS v FROM h JOIN g USING (hr)),
  b AS (SELECT src_ip, median(v) AS med FROM n GROUP BY src_ip HAVING count(*) >= 24),
  m AS (SELECT n.src_ip, any_value(b.med) AS med, median(abs(n.v - b.med)) AS mad
        FROM n JOIN b USING (src_ip) GROUP BY n.src_ip),
  f AS (SELECT n.src_ip, n.hr FROM n JOIN m USING (src_ip)
        WHERE n.v > m.med + 6 * greatest(m.mad, 2) AND n.x >= 50)
  SELECT ev.src_ip || '|' || strftime(ev.hr + INTERVAL 330 MINUTE, '%Y-%m-%d') AS alert_key, ev.source, ev.line
  FROM ev JOIN f USING (src_ip, hr) WHERE log_desc = 'Admin login failed'
entities: {src_ip: src_ip, dst_ip: dst_ip, user: user}
action_text: "{src_ip} failed {event_count} admin logins in hours far above its own normal"
