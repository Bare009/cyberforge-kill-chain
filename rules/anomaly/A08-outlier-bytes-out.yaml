id: A08-outlier-bytes-out
title: Source sending far more data out in an hour than its own normal
status: experimental
layer: anomaly
tuning: "outbound bytes to outside hosts (lines with sent > rcvd) per hour / g(hour) above median + 6 MAD (MAD floor 100 kB), raw >= 1 MB; firex-10G: 2 hours, 2 alerts, both 10.10.10.118 (chain B), 0 background"
attack:
  technique: T1048
  alt_techniques: [T1048.002, T1041, T1030]
  tactic: exfiltration
severity: 2
confidence: 0.3
promote: false
kind: sql
sql: |
  WITH ev AS (SELECT source, line, src_ip, ts_utc, date_trunc('hour', ts_utc) AS hr, log_type, log_desc,
                     dst_ip, dst_port, dst_internal, sent_bytes, rcvd_bytes FROM {events} WHERE src_ip IS NOT NULL),
  tot AS (SELECT hr, count(*) FILTER (WHERE log_type = 'traffic') AS s FROM ev GROUP BY hr),
  g AS (SELECT hr, s / nullif((SELECT median(s) FROM tot), 0) AS g FROM tot),
  h AS (SELECT src_ip, hr, coalesce(sum(sent_bytes) FILTER (WHERE log_type = 'traffic' AND NOT dst_internal AND sent_bytes > coalesce(rcvd_bytes, 0)), 0) AS x FROM ev GROUP BY src_ip, hr),
  n AS (SELECT h.*, h.x / nullif(g.g, 0) AS v FROM h JOIN g USING (hr)),
  b AS (SELECT src_ip, median(v) AS med FROM n GROUP BY src_ip HAVING count(*) >= 24),
  m AS (SELECT n.src_ip, any_value(b.med) AS med, median(abs(n.v - b.med)) AS mad
        FROM n JOIN b USING (src_ip) GROUP BY n.src_ip),
  f AS (SELECT n.src_ip, n.hr FROM n JOIN m USING (src_ip)
        WHERE n.v > m.med + 6 * greatest(m.mad, 100000) AND n.x >= 1000000)
  SELECT ev.src_ip || '|' || strftime(ev.hr + INTERVAL 330 MINUTE, '%Y-%m-%d') AS alert_key, ev.source, ev.line
  FROM ev JOIN f USING (src_ip, hr) WHERE log_type = 'traffic' AND NOT dst_internal AND sent_bytes > coalesce(rcvd_bytes, 0)
entities: {src_ip: src_ip, dst_ip: dst_ip, user: user}
action_text: "{src_ip} sent data out in {event_count} sessions, far more per hour than its own normal"
