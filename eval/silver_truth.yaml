  - id: 15
    name: rogue-admin-account
    class: hard
    steps:
      - {name: admin added, used and deleted, technique: T1136.001, alt: [T1098, T1136, T1078], tactic: persistence, expect: 3,
         where: "(user = 'Rakes' AND log_desc = 'Object attribute configured') OR (user = 'svc_backup30' AND log_desc = 'Admin login successful')"}

  - id: 16
    name: sql-injection
    class: easy
    steps:
      - {name: sql injection payloads, technique: T1190, alt: [T1595.002], tactic: initial-access, expect: 220,
         where: "src_ip = '131.228.119.59' AND log_subtype = 'ips'"}

  - id: 17
    name: cross-site-scripting
    class: easy
    steps:
      - {name: reflected xss payloads, technique: T1189, alt: [T1059.007, T1190], tactic: initial-access, expect: 60,
         where: "src_ip = '178.50.251.250' AND log_subtype = 'ips'"}

  - id: 18
    name: path-traversal
    class: easy
    steps:
      - {name: traversal and php filter payloads, technique: T1190, alt: [T1083], tactic: initial-access, expect: 80,
         where: "src_ip = '72.90.113.105' AND log_subtype = 'ips'"}

  - id: 19
    name: command-injection
    class: medium
    steps:
      - {name: shell metacharacters in a parameter, technique: T1190, alt: [T1059.004], tactic: initial-access, expect: 55,
         where: "src_ip = '72.7.116.239' AND log_subtype = 'ips'"}

  - id: 20
    name: web-shell-in-use
    class: hard
    steps:
      - {name: requests to upload paths nobody else uses, technique: T1505.003, alt: [T1071.001], tactic: persistence, expect: 120,
         where: "src_ip = '202.36.226.247' AND log_subtype = 'webfilter'"}

  - id: 21
    name: syn-flood
    class: easy
    steps:
      - {name: half-open connections from one /16, technique: T1498.001, alt: [T1498], tactic: impact, expect: 9000,
         where: "src_ip LIKE '189.238.%' AND dst_ip = '10.10.20.20' AND action = 'deny'"}

  - id: 22
    name: http-flood
    class: medium
    steps:
      - {name: one request each from thousands of addresses, technique: T1498.001, alt: [T1499.002, T1498, T1499], tactic: impact,
         expect: 6000, tolerance: 0.01,
         where: "dst_ip = '10.10.20.20' AND dst_port = 443 AND log_type = 'traffic' AND action = 'accept' AND ts_ist >= TIMESTAMP '2026-10-24 07:24:00' AND ts_ist < TIMESTAMP '2026-10-24 07:34:00'"}

  - id: 23
    name: dns-amplification
    class: medium
    steps:
