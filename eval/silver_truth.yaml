         where: "src_port = 53 AND proto = 17 AND dst_ip = '203.0.113.5'"}

  - id: 28
    name: chain-web-to-domain-admin
    class: insane
    ordered: true
    steps:
      - {name: port sweep of the portal, technique: T1595.002, alt: [T1046, T1595], tactic: reconnaissance, expect: 240,
         where: "src_ip = '32.127.48.11' AND dst_ip = '10.10.20.20' AND log_type = 'traffic' AND action = 'deny'"}
      - {name: sql injection, technique: T1190, alt: [], tactic: initial-access, expect: 60,
         where: "src_ip = '32.127.48.11' AND log_subtype = 'ips'"}
      - {name: web shell, technique: T1505.003, alt: [], tactic: persistence, expect: 40,
         where: "src_ip = '32.127.48.11' AND log_subtype = 'webfilter'"}
      - {name: large transfer, technique: T1048.002, alt: [T1048, T1041], tactic: exfiltration, expect: 600,
         where: "src_ip = '32.127.48.11' AND dst_ip = '10.10.20.20' AND log_type = 'traffic' AND action = 'accept'"}

  - id: 29
