# Silver truth: the planted attacks found by hand in firex-10G.log
# (docs/build-plan.md section 2.3). Each step is a DuckDB condition over the
# `events` view (ts_valid rows only) and the exact number of lines it must
# match. `ids` follow the organisers' manifest numbering; `class` is the
# manifest's difficulty. The expected counts equal the manifest's event counts
# for the same incident type.
#
# Fields per incident: id, name, class, ordered (steps must be rebuilt in this
# order), steps[]. Per step: name, technique (primary), alt (other acceptable
# ids), tactic, where, expect (line count), tolerance (share, default 0).

file: firex-10G.log
incidents:
  - id: 1
    name: brute-force-burst
    class: easy
    steps:
      - {name: failed admin logins, technique: T1110.001, alt: [T1110], tactic: credential-access, expect: 2000,
         where: "src_ip = '15.199.16.197' AND log_desc = 'Admin login failed'"}

  - id: 2
    name: port-scan
    class: easy
    steps:
      - {name: ports probed, technique: T1046, alt: [T1595.001, T1595], tactic: discovery, expect: 1024,
         where: "src_ip = '194.102.163.167' AND dst_ip = '10.10.20.20' AND log_type = 'traffic'"}

  - id: 3
    name: known-bad-destination
    class: easy
    steps:
      - {name: iot hosts to botnet controller on telnet, technique: T1071.001, alt: [T1071], tactic: command-and-control, expect: 60,
         where: "dst_ip = '154.35.54.115' AND dst_port = 23"}

  - id: 4
    name: malware-download
    class: easy
    steps:
      - {name: executable served as pdf, technique: T1105, alt: [], tactic: command-and-control, expect: 12,
         where: "hostname = 'hoguyusebavox.info' AND log_subtype = 'virus'"}

  - id: 5
    name: admin-login-odd-hour
    class: easy
    steps:
      - {name: admin login at night from abroad, technique: T1078.001, alt: [T1078], tactic: initial-access, expect: 3,
         where: "user = 'Deepika.Khan' AND log_desc = 'Admin login successful'"}

  - id: 6
    name: slow-credential-stuffing
    class: medium
    steps:
      - {name: one try per address across a /24, technique: T1110.004, alt: [T1110], tactic: credential-access, expect: 90,
         where: "src_net24 = '71.54.76.0/24' AND log_desc = 'Admin login failed'"}

  - id: 7
    name: successful-login-after-failures
    class: medium
    ordered: true
    steps:
      - {name: failures from one /24, technique: T1110.001, alt: [T1110], tactic: credential-access, expect: 29,
         where: "src_net24 = '8.42.69.0/24' AND log_desc = 'Admin login failed'"}
      - {name: the successful login, technique: T1078, alt: [T1078.001, T1110.001], tactic: initial-access, expect: 1,
         where: "src_net24 = '8.42.69.0/24' AND log_desc = 'Admin login successful'"}

  - id: 8
    name: impossible-travel
    class: medium
    steps:
      - {name: vpn tunnel up from two countries, technique: T1078.004, alt: [T1078], tactic: initial-access, expect: 4,
         where: "user = 'keerat.ghughal' AND action = 'tunnel-up'"}

  - id: 9
    name: lateral-movement
    class: medium
    steps:
      - {name: smb to many servers, technique: T1021.002, alt: [T1021], tactic: lateral-movement, expect: 90,
         where: "src_ip = '10.10.10.63' AND dst_internal AND dst_port = 445"}
      - {name: rdp to many servers, technique: T1021.001, alt: [T1021], tactic: lateral-movement, expect: 90,
         where: "src_ip = '10.10.10.63' AND dst_internal AND dst_port = 3389"}

  - id: 10
    name: dns-tunnel
    class: medium
    steps:
      - {name: long labels under one domain, technique: T1071.004, alt: [T1048.003, T1071], tactic: command-and-control, expect: 1500,
         where: "src_ip = '10.10.10.88' AND log_subtype = 'dns' AND hostname LIKE '%.doqotobitum.com'"}

  - id: 11
    name: c2-beaconing
    class: hard
    steps:
      - {name: connection every 300 s, technique: T1071.001, alt: [T1573, T1071], tactic: command-and-control, expect: 1612,
         where: "src_ip = '10.10.10.112' AND dst_ip = '198.79.124.52'"}

  - id: 12
    name: staged-exfiltration
    class: hard
    steps:
      - {name: 41 MB out in 2000 pieces, technique: T1048.002, alt: [T1030, T1048], tactic: exfiltration, expect: 2000,
         where: "src_ip = '10.10.20.31' AND dst_ip = '7.93.184.183'"}

  - id: 13
    name: insider-drift
    class: hard
    steps:
      - {name: smb to a growing set of servers, technique: T1078.002, alt: [T1083, T1078, T1021.002], tactic: initial-access, expect: 2400,
         where: "src_ip = '10.10.10.44' AND dst_internal AND dst_port = 445"}

  - id: 14
    name: logging-disabled-around-a-change
    class: hard
    steps:
      - {name: log disk off, policies purged, log disk on, technique: T1562.002, alt: [T1070, T1562], tactic: defense-evasion, expect: 3,
