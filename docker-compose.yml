# KillChain (docs/build-plan.md P14).
#
#   docker compose up -d --build            UI on http://localhost:8080, API on http://localhost:8000
#   KILLCHAIN_RUN=firex-10G docker compose up -d     serve data/runs/firex-10G instead of the sample
#   docker compose run --rm pipeline-all firex-10G.log     process ./logs/firex-10G.log into data/runs/firex-10G
#   docker compose run --rm pipeline detect --run data/runs/firex-10G      one stage
#   docker compose --profile live up -d     also the live process (P15, track A)
#
# Settings (shell or .env): KILLCHAIN_RUN (default sample-run), LOGS_DIR (default ./logs),
# API_PORT (8000), WEB_PORT (8080), PARSE_WORKERS (4). Keys come from .env (optional).

x-python: &python
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: pipeline
  image: killchain-pipeline
  env_file:
    - path: .env
      required: false
  environment: &env
    KILLCHAIN_DATA_DIR: /app/data
    KILLCHAIN_RAW_DIR: /app/logs
    PARSE_WORKERS: ${PARSE_WORKERS:-4}
  volumes:
    - ./data:/app/data
    - ./rules:/app/rules
    - ${LOGS_DIR:-./logs}:/app/logs:ro

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    image: killchain-api
    env_file:
      - path: .env
        required: false
    environment:
      <<: *env
      KILLCHAIN_RUN: ${KILLCHAIN_RUN:-sample-run}
      # SIEM connections (killchain/connectors): API-pull poller on by default,
      # syslog listener off unless KILLCHAIN_SYSLOG=1; webhook URLs shown in the UI use the base URL.
      KILLCHAIN_CONNECTORS: ${KILLCHAIN_CONNECTORS:-1}
      KILLCHAIN_SYSLOG: ${KILLCHAIN_SYSLOG:-0}
      CONNECTOR_CREDENTIALS_KEY: ${CONNECTOR_CREDENTIALS_KEY:-}
      INGEST_PUBLIC_BASE_URL: ${INGEST_PUBLIC_BASE_URL:-http://localhost:${API_PORT:-8000}}
    volumes:
      - ./data:/app/data:ro                 # runs are read only ...
      - ./data/cache:/app/data/cache        # ... except the threat-intel and LLM caches
      - ./data/connectors:/app/data/connectors   # ... SIEM connections (connectors.json, credentials key)
      - ./data/ingest:/app/data/ingest      # ... and what they deliver (records, live.log)
      - ./rules:/app/rules                  # rules saved from the rule writer land in ./rules
      - ${LOGS_DIR:-./logs}:/app/logs:ro    # raw log text for the Evidence tab (read at byte offsets)
    ports:
      - "${API_PORT:-8000}:8000"
      - "${SYSLOG_HOST_PORT:-5514}:5514/udp"  # syslog listener (only with KILLCHAIN_SYSLOG=1)
      - "${SYSLOG_HOST_PORT:-5514}:5514/tcp"
    restart: unless-stopped

  web:
    build: ./web
    image: killchain-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  pipeline:
    <<: *python
    profiles: ["pipeline"]

  pipeline-all:
    <<: *python
    entrypoint: ["/app/docker/pipeline.sh"]
    profiles: ["pipeline"]

  live:
    <<: *python
    profiles: ["live"]
    command: ["live", "--run", "data/runs/${KILLCHAIN_RUN:-sample-run}"]
    restart: unless-stopped
  # Live mode over what the SIEM connections deliver (data/ingest/live.log, written by the api).
  # Serve its run with KILLCHAIN_RUN=live-ingest once it has published.
  live-ingest:
    <<: *python
    profiles: ["live"]
    command: ["live", "--input", "data/ingest/live.log", "--run", "data/runs/live-ingest"]
    restart: unless-stopped
