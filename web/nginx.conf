server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API, at /api/ on the same origin. The trailing slash strips /api.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;          # rule drafts and Q&A wait on the LLM
        client_max_body_size 1m;
    }

    # Live updates are Server-Sent Events: no buffering, long-lived.
    location = /api/live/stream {
        proxy_pass http://api:8000/live/stream$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Built assets have hashed names: cache them; never cache index.html.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/incidents/3, /live, ...) all load the app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
