# Field names of other security products -> killchain's canonical columns (killchain/schema, docs/schema.md).
#
# Matching ignores case and every character that is not a letter or digit, so "Source address",
# "source_address", "sourceAddress" and "source.address" are the same name. A nested JSON field is
# matched on its full dotted path first ("source.ip", "winlog.event_data.TargetUserName"); a field
# no full name matches is also tried on its last one or two path parts when they have 5 or more
# characters ("data.srcip" -> "srcip"), only against names without a dot here, so "x.src" never
# matches "src" and "Entities.HostName" never matches "host.name".
#
# Order matters: for each column the names found in the log are taken in list order and up to
# three are kept (first non-empty value per record wins), so mixed record types can fill one
# column from different fields. A field feeds only the first column that names it (see
# shared_fields). An entry may be limited to some input formats: {name: hostname, formats: [kv]},
# or to its exact spelling (case-insensitive, separators kept): {name: rule.name, exact: true}, so
# ECS rule.name (a signature) is not taken for Check Point rule_name (a policy rule).
#
# Products covered: FortiGate, Palo Alto (CSV export headers), Check Point, Cisco ASA (syslog
# patterns below), Sophos, Elastic ECS, OCSF, CEF / LEEF, Microsoft Sentinel and Defender,
# SentinelOne, CrowdStrike, Windows Security and Sysmon events, Okta, Wazuh, Splunk exports.

wrappers: ["_source.", "result.", "fields."]     # Elastic / Splunk export envelopes, stripped

