  src_ip: [srcip, src_ip, source.ip, src_endpoint.ip, Source address, Source IP, SourceIP, SourceIp, SourceAddress,
           cef.extensions.src, leef.attributes.src, data.srcip, data.src_ip, client.ip, client.ipAddress, ClientIP,
           client_ip, IpAddress, winlog.event_data.IpAddress, EventData.IpAddress, LocalAddressIP4, aip, src_addr,
