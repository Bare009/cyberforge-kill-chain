# Contextual value maps, applied after value_maps: FortiGate uses different words for the same
# outcome in different log subtypes (an allowed web request is "passthrough", a blocked IPS hit
# is "dropped"). Only the listed words change.
value_maps_by:
  action:
    by: log_subtype
    maps:
      forward: {dropped: deny, blocked: deny, reset: deny}
      ips: {deny: dropped, blocked: dropped, reset: dropped, accept: detected}
      virus: {deny: blocked, dropped: blocked, reset: blocked, accept: detected}
      webfilter: {accept: passthrough, detected: passthrough, deny: blocked, dropped: blocked, reset: blocked}
      dns: {accept: pass, detected: pass}
      app-ctrl: {accept: pass, detected: pass}

# Derived values, applied in order after the value maps. `when` lists allowed values per column
# (lower case, already mapped); `set` fills columns that are still empty; `copy` copies one column
# into another that is empty.
derive:
  - name: PAN-style admin authentication events
    when: {event_id: [auth-fail, admin-auth-fail, login-failed, auth-failure]}
    set: {action: login, status: failed}
  - name: PAN-style admin authentication events
    when: {event_id: [auth-success, admin-auth-success, login-succeeded, login-success]}
    set: {action: login, status: success}
  - name: admin login failed (a login to the device itself, logged by the device)
    when: {log_type: [event], action: [login], status: [failed]}
    set: {log_desc: Admin login failed}
  - name: admin login successful
    when: {log_type: [event], action: [login], status: [success]}
    set: {log_desc: Admin login successful}
  - name: VPN tunnel up
    when: {log_subtype: [vpn], action: [tunnel-up]}
    set: {log_desc: SSL VPN tunnel up}
  - name: malware name from the threat name
    when: {log_subtype: [virus]}
    copy: {virus: attack}

# Free-text syslog messages: a regex with named groups. A group named after a canonical column
# fills it; `set` adds fixed values. Tried in order on the message text; the first match wins.
message_patterns:
  - name: cisco-asa-302013 built
    regex: '%ASA-\d-30201[35]: Built (?P<direction>inbound|outbound) (?P<proto>TCP|UDP) connection (?P<session_id>\d+) for (?P<src_intf>[^:\s]+):(?P<src_ip>[\d.]+)/(?P<src_port>\d+) .*?to (?P<dst_intf>[^:\s]+):(?P<dst_ip>[\d.]+)/(?P<dst_port>\d+)'
    set: {action: accept, log_type: traffic}
  - name: cisco-asa-302014 teardown
    regex: '%ASA-\d-30201[46]: Teardown (?P<proto>TCP|UDP) connection (?P<session_id>\d+) for (?P<src_intf>[^:\s]+):(?P<src_ip>[\d.]+)/(?P<src_port>\d+) .*?to (?P<dst_intf>[^:\s]+):(?P<dst_ip>[\d.]+)/(?P<dst_port>\d+)(?: duration (?P<duration_hms>[\d:]+))?(?: bytes (?P<sent_bytes>\d+))?'
    set: {action: close, log_type: traffic}
  - name: cisco-asa-106023 deny
    regex: '%ASA-\d-10602[13]: Deny (?P<proto>tcp|udp|icmp) src (?P<src_intf>[^:\s]+):(?P<src_ip>[\d.]+)(?:/(?P<src_port>\d+))? dst (?P<dst_intf>[^:\s]+):(?P<dst_ip>[\d.]+)(?:/(?P<dst_port>\d+))?'
    set: {action: deny, log_type: traffic}
  - name: cisco-asa-106001 deny
    regex: '%ASA-\d-10600[16]: (?:Inbound )?(?P<proto>TCP|UDP) (?:access )?denied (?:from|by) (?P<src_ip>[\d.]+)/(?P<src_port>\d+) to (?P<dst_ip>[\d.]+)/(?P<dst_port>\d+)'
    set: {action: deny, log_type: traffic}
  - name: cisco-asa-106100 acl
    regex: '%ASA-\d-106100: access-list \S+ (?P<action>permitted|denied) (?P<proto>tcp|udp|icmp) (?P<src_intf>[^/\s]+)/(?P<src_ip>[\d.]+)\((?P<src_port>\d+)\) -> (?P<dst_intf>[^/\s]+)/(?P<dst_ip>[\d.]+)\((?P<dst_port>\d+)\)'
    set: {log_type: traffic}
  - name: cisco-asa-605004 login denied
    regex: '%ASA-\d-605004: Login denied from (?P<src_ip>[\d.]+)/(?P<src_port>\d+) to (?P<dst_intf>[^:\s]+):(?P<dst_ip>[\d.]+)/(?P<service>\S+) for user "(?P<user>[^"]*)"'
    set: {log_desc: Admin login failed, status: failed, action: login, log_type: event, log_subtype: system}
  - name: cisco-asa-605005 login permitted
    regex: '%ASA-\d-605005: Login permitted from (?P<src_ip>[\d.]+)/(?P<src_port>\d+) to (?P<dst_intf>[^:\s]+):(?P<dst_ip>[\d.]+)/(?P<service>\S+) for user "(?P<user>[^"]*)"'
    set: {log_desc: Admin login successful, status: success, action: login, log_type: event, log_subtype: system}
  - name: cisco-asa-113015 aaa rejected
    regex: '%ASA-\d-113015: AAA user authentication Rejected.*?user = (?P<user>[^\s:]+)(?: : user IP = (?P<src_ip>[\d.]+))?'
    set: {status: failed, log_type: event, log_subtype: auth}
  - name: sshd failed password
    regex: 'sshd\[\d+\]: Failed (?:password|publickey) for (?:invalid user )?(?P<user>\S+) from (?P<src_ip>[\d.]+) port (?P<src_port>\d+)'
    set: {status: failed, dst_port: "22", log_subtype: auth}
  - name: sshd accepted
    regex: 'sshd\[\d+\]: Accepted (?:password|publickey) for (?P<user>\S+) from (?P<src_ip>[\d.]+) port (?P<src_port>\d+)'
    set: {status: success, dst_port: "22", log_subtype: auth}
