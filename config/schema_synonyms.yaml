    block-continue: blocked
    sinkhole: blocked
    prevented: blocked
    prevent: blocked
    quarantine: blocked
    quarantined: blocked
    reset-both: reset
    reset-client: reset
    reset-server: reset
    reset: reset
    alert: detected
    detected: detected
    detect: detected
    monitor: detected
    continue: passthrough
    override: passthrough
    tunnel-up: tunnel-up
    tunnel-down: tunnel-down
    login: login
    logon: login
