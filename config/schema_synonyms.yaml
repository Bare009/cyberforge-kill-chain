# A field feeds only the first column (in the order above) that names it, except for these pairs,
# which may read the same field (ECS event.category gives both log_type and log_subtype ...).
shared_fields: [[log_type, log_subtype], [log_id, event_id], [hostname, dns_query], [ts, time_of_day],
                [date, ts]]

# Fields that tell record kinds apart. The first one found groups the sample for the category
# (network | endpoint | auth | vendor_alert | other) and the report.
event_type_fields: [type, Type, event.dataset, event.category, event.kind, class_name, category_name, EventID,
                    winlog.event_id, event.code, eventType, Log Type, log_type, logtype, ActionType, rule.groups]

