# Vendor alerts (alerts another product already raised, e.g. Sentinel, SentinelOne, CrowdStrike,
# Defender, an EDR, Wazuh) become killchain alerts with layer "vendor" (killchain/detect/vendor.py,
# run by `python -m killchain detect`).
#
# Their ATT&CK label comes from, in order: the record's own MITRE technique ids (validated against the
# catalogue), else its MITRE tactic alone (technique "unknown"), else this keyword table (regex on the
# alert name plus the attack, virus and msg text, case-insensitive, FIRST MATCH WINS, so specific
# patterns come before general ones), else one LLM call labelling the distinct alert names left
# (cached; skipped with --no-llm), else technique "unknown".
#
# Each entry: pattern (Python regex), technique (ATT&CK id), tactic (required when the technique has
# several tactics). The loader checks every label against the catalogue.

group_gap: 1h            # same product + alert name + main entity within this gap -> one alert
default_confidence: 0.7  # when the vendor gives none
default_severity: 3      # when the vendor gives none (1-5)
promote_severity: 4      # a vendor alert at or above this severity is an incident on its own

keywords:
  # credential access
  - {pattern: 'password.?spray|spray(ing)? attack', technique: T1110.003, tactic: credential-access}
  - {pattern: 'credential stuffing', technique: T1110.004, tactic: credential-access}
  - {pattern: 'brute.?force|password guess|many failed (log ?ins|logons|sign.?ins|logins)|multiple failed (log ?ins|logons|sign.?ins|logins)|failed (logons?|logins?) from single|account lock.?out|authentication fail', technique: T1110, tactic: credential-access}
  - {pattern: 'kerberoast|\btgs\b.*(request|rc4)|spn (scan|request)', technique: T1558.003, tactic: credential-access}
  - {pattern: 'golden ticket|silver ticket|forged (kerberos )?ticket', technique: T1558, tactic: credential-access}
  - {pattern: 'pass.the.hash|\bpth\b|ntlm relay|overpass', technique: T1550.002, tactic: lateral-movement}
  - {pattern: 'pass.the.ticket', technique: T1550.003, tactic: lateral-movement}
  - {pattern: 'mimikatz|lsass|sekurlsa|procdump|comsvcs|minidump|credential dump(ing)?|dump(ed|ing)? credentials', technique: T1003.001, tactic: credential-access}
  - {pattern: 'dcsync|ntds(\.dit)?|sam hive|password dump|credential (theft|access)|hash dump', technique: T1003, tactic: credential-access}
  # initial access
  - {pattern: 'malicious (attachment|macro|document)|macro[- ]enabled|weaponi[sz]ed document|office (app(lication)?|document) spawn', technique: T1566.001, tactic: initial-access}
  - {pattern: 'phish|malicious (link|url) (in|clicked)|credential harvest', technique: T1566, tactic: initial-access}
  - {pattern: 'impossible travel|atypical travel|unfamiliar sign.?in|anomalous (sign.?in|login|logon)|suspicious (sign.?in|login|logon)|sign.?in from (an? )?(unusual|new|anonymous)|anonymous ip|tor exit', technique: T1078, tactic: initial-access}
  - {pattern: 'sql.?injection|\bsqli\b', technique: T1190, tactic: initial-access}
  - {pattern: 'cross.site.scripting|\bxss\b', technique: T1189, tactic: initial-access}
  - {pattern: 'path traversal|directory traversal|command injection|remote code execution|\brce\b|exploit(ation)? (of|against|attempt)|exploit(ed)? (public|web|vulnerab)|\bcve-\d{4}-\d+|log4(j|shell)', technique: T1190, tactic: initial-access}
  - {pattern: 'web ?shell|china ?chopper', technique: T1505.003, tactic: persistence}
  # execution
  - {pattern: 'powershell|encoded command|-enc(odedcommand)?\b|frombase64string|invoke-expression|\biex\b', technique: T1059.001, tactic: execution}
  - {pattern: 'vbscript|wscript|cscript|\.vbs\b', technique: T1059.005, tactic: execution}
  - {pattern: 'javascript|jscript|\.js\b.*(execut|run)', technique: T1059.007, tactic: execution}
  - {pattern: 'bash|/bin/sh|unix shell|reverse shell', technique: T1059.004, tactic: execution}
  - {pattern: 'cmd\.exe|command shell|windows command|command prompt', technique: T1059.003, tactic: execution}
  - {pattern: 'script(ing)? (engine|interpreter|host)|malicious script|suspicious script', technique: T1059, tactic: execution}
  - {pattern: 'mshta|rundll32|regsvr32|certutil|bitsadmin|lolbin|living.off.the.land|signed binary proxy', technique: T1218, tactic: defense-evasion}
  # impact (before generic malware)
  - {pattern: 'ransom|mass file (rename|encrypt|modif)|files? (were |being )?encrypted|encrypt(ion|ed)? (of )?(many|multiple|user) files|\.locked\b|rapid .*rename', technique: T1486, tactic: impact}
  - {pattern: 'shadow cop(y|ies)|vssadmin|wbadmin.*delete|recovery (disabled|inhibit)|bcdedit', technique: T1490, tactic: impact}
  - {pattern: 'wiper|disk wipe|mbr (overwrite|wipe)', technique: T1561, tactic: impact}
  - {pattern: 'denial.of.service|\bddos\b|\bdos attack|syn flood|http flood|udp flood|amplification', technique: T1498, tactic: impact}
  - {pattern: 'crypto ?min(er|ing)|coin ?min(er|ing)|xmrig', technique: T1496, tactic: impact}
  # lateral movement
  - {pattern: '\brdp\b|remote desktop|terminal services', technique: T1021.001, tactic: lateral-movement}
  - {pattern: 'psexec|paexec|admin\$|admin share|smb.*(lateral|remote exec)|remote service (creation|install)', technique: T1021.002, tactic: lateral-movement}
  - {pattern: '\bwmi\b|wmic|windows management instrumentation', technique: T1047, tactic: execution}
  - {pattern: 'winrm|ps.?remoting|invoke-command|enter-pssession', technique: T1021.006, tactic: lateral-movement}
  - {pattern: '\bssh\b.*(lateral|internal)|lateral movement|lateral tool|remote execution', technique: T1021, tactic: lateral-movement}
  # persistence / privilege escalation
  - {pattern: 'scheduled task|schtasks|cron ?job|at\.exe', technique: T1053.005, tactic: persistence}
  - {pattern: 'registry run key|run ?key|autorun|startup folder', technique: T1547.001, tactic: persistence}
  - {pattern: 'new service|service (was )?(install|creat)|sc(\.exe)? create', technique: T1543.003, tactic: persistence}
  - {pattern: 'new (local )?admin|added to (the )?(domain |local |enterprise )?admin|privileged group|security.enabled (global|local|universal) group', technique: T1098, tactic: persistence}
  - {pattern: 'account (was )?created|new user account|user account created', technique: T1136, tactic: persistence}
  - {pattern: 'persistence', technique: T1547, tactic: persistence}
  - {pattern: 'privilege escalation|uac bypass|token (manipulation|impersonation)|sudo|setuid|elevat(ed|ion)', technique: T1548, tactic: privilege-escalation}
  # defense evasion
  - {pattern: 'log(s)? (was |were )?clear|event log (was )?clear|audit log (clear|delet)|wevtutil|clear-eventlog', technique: T1070.001, tactic: defense-evasion}
  - {pattern: '(defender|antivirus|\bav\b|edr|security (tool|agent|service)).*(disabl|stop|tamper|turned off|kill)|tamper(ing)? (protection|attempt)|disabl(e|ed|ing) (security|antivirus|defender|real.?time)', technique: T1562.001, tactic: defense-evasion}
  - {pattern: 'process injection|injected|process hollowing|reflective (dll|load)', technique: T1055, tactic: defense-evasion}
  - {pattern: 'obfuscat|packed (file|binary)|masquerad', technique: T1027, tactic: defense-evasion}
  - {pattern: 'defen[cs]e evasion|evasion', technique: T1562, tactic: defense-evasion}
  # discovery
  - {pattern: 'port ?scan|network scan|host (discovery|sweep)|ping sweep|service discovery|nmap|masscan', technique: T1046, tactic: discovery}
  - {pattern: 'reconnaissance|\brecon\b|enumerat|discovery (command|activity)|bloodhound|sharphound|adfind', technique: T1087, tactic: discovery}
  # command and control (DNS tunnel before the general patterns)
  - {pattern: 'dns tunnel|dns exfil|iodine|dnscat', technique: T1071.004, tactic: command-and-control}
  - {pattern: 'cobalt ?strike|beacon|command.and.control|\bc2\b|\bc&c\b|callback to|low.reputation (destination|domain|ip)|malicious (domain|ip|destination)', technique: T1071, tactic: command-and-control}
  - {pattern: 'tor (traffic|connection)|proxy tunnel|ngrok', technique: T1090, tactic: command-and-control}
  - {pattern: 'tool (download|transfer)|ingress tool|downloaded (a )?(malicious|suspicious) (file|tool)', technique: T1105, tactic: command-and-control}
  # exfiltration
  - {pattern: 'exfiltrat|data (transfer|upload) to|large (upload|outbound|data transfer)|data theft|unusual (upload|outbound)', technique: T1048, tactic: exfiltration}
  # generic malware last
  - {pattern: 'malware|trojan|virus|malicious (file|executable|binary|software)|\bworm\b|backdoor|\brat\b|infostealer|stealer|spyware|keylogger|dropper|rootkit', technique: T1204.002, tactic: execution}
  - {pattern: 'exploit', technique: T1203, tactic: execution}
