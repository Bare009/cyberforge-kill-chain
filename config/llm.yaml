# LLM agents (docs/build-plan.md P10b). Keys and model names come from .env.
#
# Free-tier limits per model. Groq's are from https://console.groq.com/docs/rate-limits
# (checked 2026-11-01; they change). Groq shut down llama-3.3-70b-versatile and
# llama-3.1-8b-instant for free and developer keys on 2026-08-16; use openai/gpt-oss-120b
# (large) and openai/gpt-oss-20b (small). NeevCloud's limits come from its dashboard:
# put them under `models:` by model name. A model without an entry uses `default`.
# The client keeps under these with a margin and never retries a 429 at once.

timeout_s: 30
temperature: 0
margin: 0.9                 # use at most 90% of each limit
max_wait_s: 20              # wait at most this long for a minute bucket or a retry-after; else try the next model
auth_cooldown_s: 600        # after a 401/403, skip that provider for 10 minutes

default:
  requests_per_minute: 20
  requests_per_day: 1000
  tokens_per_minute: 6000
  tokens_per_day: 100000

models:
  openai/gpt-oss-120b:
    requests_per_minute: 30
    requests_per_day: 1000
    tokens_per_minute: 8000
    tokens_per_day: 200000
  openai/gpt-oss-20b:
    requests_per_minute: 30
    requests_per_day: 1000
    tokens_per_minute: 8000
    tokens_per_day: 200000

# Reasoning models think before they answer, and that hidden reasoning counts against
# max_tokens. For a model whose name matches `match` (a regex, case-insensitive), each call
# sends `reasoning_effort: <effort>` and gets `extra_tokens` more output tokens than the job's
# max_tokens below. Low effort is enough for these jobs: the facts are all in the prompt.
reasoning:
  - match: gpt-oss
    effort: low
    extra_tokens: 1000

narrator:
  max_tokens: 700           # output cap; the fact sheet is ~1,200 tokens in
  prompt_version: 1         # bump when prompts/narrator.md changes, so old reports are redone

qa:                         # incident Q&A from the UI: small model
  max_tokens: 400
  max_lines: 60             # evidence lines sent with a question

rule_writer:                # rule drafts from the UI: large model
  max_tokens: 900
  test_timeout_s: 60        # a test run of a rule is stopped after this
  test_memory_limit: 2GB

on_demand_per_minute: 6     # Q&A questions and rule drafts from the UI, together; then 429 with Retry-After
